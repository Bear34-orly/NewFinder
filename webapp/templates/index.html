<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche Finder</title>
<link rel="stylesheet" href="/static/competition.css?v=1">
<style>
  /* Couleurs inspirées de YouTube */
  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --surface-2: #272727;
    --border: #303030;
    --text: #f1f1f1;
    --muted: #aaaaaa;
    --accent: #ff0000;
    --accent-text: #ffffff;
    --green: #2ecc71;
    --blue: #3ea6ff;
    --blue-text: #0f0f0f;
    --amber: #f5c518;
    --red: #ff4e45;
    --radius: 12px;
    --gap: 16px;
    --side-w: 256px;
    --top-h: 56px;
  }
  :root[data-theme="light"] {
    --bg: #f9f9f9;
    --surface: #ffffff;
    --surface-2: #f2f2f2;
    --border: #e5e5e5;
    --text: #0f0f0f;
    --muted: #606060;
    --blue: #065fd4;
    --blue-text: #ffffff;
    --red: #cc0000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Roboto, Arial, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---------- Barre du haut ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    height: var(--top-h);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .brand-mark {
    width: 32px; height: 24px; border-radius: 7px;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center;
  }
  .topbar-actions { display: flex; gap: 8px; }
  .icon-btn {
    min-width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 0 12px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit;
  }
  .icon-btn:hover { border-color: var(--muted); }
  #filters-toggle { display: none; }
  #menu-toggle { display: none; }

  /* ---------- Menu latéral ---------- */
  .layout { display: flex; align-items: flex-start; }
  .sidebar {
    position: sticky; top: var(--top-h);
    width: var(--side-w); flex-shrink: 0;
    height: calc(100vh - var(--top-h));
    padding: 12px 8px;
    background: var(--bg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 2px;
    overflow: visible;
  }
  .content { flex: 1; min-width: 0; }
  .side-group { position: relative; }
  .side-item {
    width: 100%; min-height: 42px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 10px 0 12px;
    background: transparent; color: var(--text);
    border: none; border-radius: 10px;
    font-size: 14px; font-family: inherit; text-align: left; cursor: pointer;
  }
  .side-item:hover { background: var(--surface-2); }
  .side-item.active { background: var(--surface-2); font-weight: 700; }
  .si-label { flex: 1; white-space: nowrap; }
  .si-state {
    font-size: 10.5px; font-weight: 700; color: var(--accent-text);
    background: var(--accent); border-radius: 999px; padding: 2px 8px; white-space: nowrap;
  }
  .si-state:empty { display: none; }
  .side-sep { height: 1px; background: var(--border); margin: 8px 4px; }
  .sub {
    display: none;
    margin: 2px 0 6px 20px; padding: 0 0 0 8px;
    border-left: 2px solid var(--border);
  }
  .sub-item {
    width: 100%; min-height: 38px; display: flex; align-items: center;
    padding: 0 12px;
    background: transparent; color: var(--text);
    border: none; border-radius: 8px;
    font-size: 13.5px; font-family: inherit; text-align: left; cursor: pointer;
  }
  .sub-item:hover { background: var(--surface-2); }
  .sub-item.active { background: var(--text); color: var(--bg); font-weight: 700; }
  .side-group:has(:focus-visible) .sub { display: block; }
  .side-group.open .sub { display: block; }
  .backdrop { display: none; }

  /* ---------- Contenu ---------- */
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .toolbar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 18px;
  }
  .field-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .field-row input, .field-row select {
    height: 40px; padding: 0 12px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: inherit;
  }
  .field-row input { flex: 1; min-width: 180px; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 14px; }

  /* ---------- Grille et cartes ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: var(--gap);
  }
  .card {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--surface-2) center/cover no-repeat;
    display: grid; place-items: center;
    font-weight: 700; color: var(--muted); flex-shrink: 0;
  }
  .card-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-sub { font-size: 12px; color: var(--muted); }
  .head-text { min-width: 0; flex: 1; }
  .pill {
    font-size: 10px; font-weight: 700; letter-spacing: .4px;
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  .pill.proven { background: var(--green); color: #0b0b0b; }
  .pill.watchlist { background: var(--blue); color: var(--blue-text); }
  .pill.new { background: var(--accent); color: var(--accent-text); }
  .head-pills { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--border); }
  .strip img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--surface-2); }
  .strip-empty { height: 6px; background: var(--surface-2); }
  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .desc {
    font-size: 12.5px; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
  .tag.good { background: var(--green); color: #0b0b0b; }
  .tag.mid { background: var(--amber); color: #0b0b0b; }
  .tag.low { background: var(--surface-2); color: var(--muted); }
  .tag.face { background: var(--amber); color: #0b0b0b; cursor: help; display: inline-flex; align-items: center; padding: 3px 6px; }
  .tag.face svg { width: 16px; height: 16px; stroke-width: 2.2; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface-2); border-radius: 8px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 15px; }
  .stat span { font-size: 11px; color: var(--muted); }
  .card-foot { font-size: 11.5px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: auto; }
  .btn-main {
    flex: 1; min-height: 40px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--text); color: var(--bg);
    border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 13px;
  }
  .btn-danger {
    width: 40px; min-height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--red);
    border: 1px solid var(--red); border-radius: 999px; cursor: pointer;
  }
  .btn-danger:hover { background: var(--red); color: #fff; }
  .btn-danger.labeled { width: auto; padding: 0 12px; gap: 6px; font-size: 12px; font-weight: 700; }

  .modal-ov { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; }
  .modal h3 { margin: 0; font-size: 15px; }
  .modal-input { height: 40px; padding: 0 12px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; }
  .modal p { margin: 0; color: var(--muted); font-size: 13px; }

  /* ---------- Statistiques ---------- */
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--gap); margin-bottom: 20px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .kpi b { display: block; font-size: 24px; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tbody tr.row-link { cursor: pointer; }
  tbody tr.row-link:hover { background: var(--surface-2); }
  td.num, th.num { text-align: right; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .top-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--gap); }
  .top-card { background: var(--surface-2); border-radius: 10px; padding: 12px; }
  .top-card h3 { margin: 0 0 8px; font-size: 13px; }
  .top-card a { display: flex; justify-content: space-between; gap: 8px; color: var(--text); text-decoration: none; font-size: 12.5px; padding: 4px 0; }
  .top-card a span:last-child { color: var(--muted); white-space: nowrap; }
  .top-card a:hover span:first-child { color: var(--accent); }

  /* ---------- États : chargement, vide, erreur ---------- */
  .skeleton { pointer-events: none; }
  .sk { background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .sk-row { height: 38px; margin: 12px 14px; }
  .sk-strip { aspect-ratio: 48/9; border-radius: 0; }
  .sk-line { height: 12px; margin: 10px 14px; }
  .message {
    grid-column: 1 / -1;
    text-align: center; padding: 48px 16px;
    background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
    color: var(--muted);
  }
  .message b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
  .message button { margin-top: 14px; }
  .more-wrap { text-align: center; margin: 22px 0 8px; }

  /* ---------- Téléphone et tablette ---------- */
  @media (max-width: 760px) {
    .container { padding: 12px; }
    .topbar { padding: 0 10px; }
    .brand span.brand-name { display: none; }
    #menu-toggle { display: inline-flex; }
    #filters-toggle.visible { display: inline-flex; }
    .sidebar {
      position: fixed; left: 0; top: var(--top-h); bottom: 0; z-index: 45;
      height: auto; width: 270px;
      transform: translateX(-102%); transition: transform .2s ease;
      overflow-y: auto;
    }
    .sidebar.show { transform: translateX(0); }
    .backdrop.show { display: block; position: fixed; inset: var(--top-h) 0 0 0; z-index: 44; background: rgba(0,0,0,.55); }
    .toolbar { display: none; }
    .toolbar.open { display: block; }
    .field-row select, .field-row input { flex: 1 1 100%; }
    .grid { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 761px) and (max-width: 1100px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <button class="icon-btn" id="menu-toggle" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand-mark">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <span class="brand-name">Niche Finder</span>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn visible" id="filters-toggle" aria-label="Filtres">
      <svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>Filtres
    </button>
    <button class="icon-btn" id="theme-toggle" aria-label="Changer de thème">
      <svg viewBox="0 0 24 24" id="theme-icon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="backdrop" id="backdrop"></div>
<div class="layout">

<aside class="sidebar" id="sidebar">
  <div class="side-group" data-view="new">
    <button class="side-item" data-view="new">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16v4M17 18h4"/></svg>
      <span class="si-label">Nouvelles chaînes</span><span class="si-state"></span>
    </button>
    <div class="sub">
      <button class="sub-item" data-view="new" data-status="proven">Proven</button>
      <button class="sub-item" data-view="new" data-status="watchlist">Watchlist</button>
      <button class="sub-item" data-view="new" data-status="all">Tout statut</button>
    </div>
  </div>

  <div class="side-group" data-view="all">
    <button class="side-item" data-view="all">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="si-label">Toutes les chaînes</span><span class="si-state"></span>
    </button>
    <div class="sub">
      <button class="sub-item" data-view="all" data-status="proven">Proven</button>
      <button class="sub-item" data-view="all" data-status="watchlist">Watchlist</button>
      <button class="sub-item" data-view="all" data-status="all">Tout statut</button>
    </div>
  </div>

  <div class="side-sep"></div>

  <button class="side-item" data-page="stats">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span class="si-label">Statistiques</span>
  </button>
  <button class="side-item" data-page="competition">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
    <span class="si-label">Concurrence</span>
  </button>
</aside>

<div class="content">

<!-- ===================== PAGE CHAÎNES ===================== -->
<main class="container" id="page-channels">
  <section class="toolbar" id="toolbar">
    <div class="field-row">
      <input type="search" id="search" placeholder="Rechercher une chaîne...">
      <select id="market"><option value="all">Tous les marchés</option></select>
      <select id="sort">
        <option value="density_score">Trier par densité</option>
        <option value="subscriber_count">Trier par abonnés</option>
        <option value="proven_video_count">Trier par vidéos ≥100K</option>
        <option value="first_discovered_at">Trier par date de découverte</option>
      </select>
    </div>
  </section>

  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="more-wrap" id="more-wrap" style="display:none">
    <button class="icon-btn" id="more-btn">Afficher plus</button>
  </div>
</main>

<!-- ===================== PAGE STATISTIQUES ===================== -->
<main class="container" id="page-stats" style="display:none">
  <div id="stats-content"></div>
</main>

<!-- ===================== PAGE CONCURRENCE ===================== -->
<main class="container" id="page-competition" style="display:none"></main>

</div><!-- /content -->
</div><!-- /layout -->

<script>
const PAGE_SIZE = 48;
let adminKey = null;
let currentView = 'new';
let currentStatus = 'proven';
let currentPage = 'channels';
let visibleCount = PAGE_SIZE;
let currentChannels = [];
let searchTimer = null;

const $ = id => document.getElementById(id);

function esc(value) {
  const d = document.createElement('div');
  d.textContent = value == null ? '' : String(value);
  return d.innerHTML;
}
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function fmt(n) { return (n || 0).toLocaleString('fr-FR'); }

/* ---------- Thème ---------- */
const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  $('theme-icon').innerHTML = theme === 'dark' ? SUN : MOON;
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(saved || (prefersLight ? 'light' : 'dark'));
}
$('theme-toggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('theme', next); } catch (e) {}
});

/* ---------- Filtres repliables (téléphone) ---------- */
$('filters-toggle').addEventListener('click', () => $('toolbar').classList.toggle('open'));

/* ---------- Menu latéral ---------- */
const STATUS_LABEL = { proven: 'Proven', watchlist: 'Watchlist', all: 'Tout statut' };
const isTouch = () => window.matchMedia('(hover: none)').matches;

function updateSidebar() {
  document.querySelectorAll('.side-group').forEach(g => {
    const on = currentPage === 'channels' && g.dataset.view === currentView;
    g.querySelector('.side-item').classList.toggle('active', on);
    g.querySelector('.si-state').textContent = on ? STATUS_LABEL[currentStatus] : '';
    g.querySelectorAll('.sub-item').forEach(s =>
      s.classList.toggle('active', on && s.dataset.status === currentStatus));
  });
  document.querySelectorAll('.side-item[data-page]').forEach(b =>
    b.classList.toggle('active', b.dataset.page === currentPage));
}

function closeMenu() {
  $('sidebar').classList.remove('show');
  $('backdrop').classList.remove('show');
  document.querySelectorAll('.side-group.open').forEach(g => g.classList.remove('open'));
}

function showPage(page) {
  currentPage = page;
  $('page-channels').style.display = page === 'channels' ? '' : 'none';
  $('page-stats').style.display = page === 'stats' ? '' : 'none';
  $('page-competition').style.display = page === 'competition' ? '' : 'none';
  $('filters-toggle').classList.toggle('visible', page === 'channels');
  updateSidebar();
  if (page === 'stats') loadStats();
  if (page === 'competition' && window.cpOpen) window.cpOpen();
}

function selectChannels(view, status) {
  currentView = view;
  if (status) currentStatus = status;
  showPage('channels');
  loadChannels();
}

/* Ordinateur : les options apparaissent quand la souris est sur le groupe */
document.querySelectorAll('.side-group').forEach(g => {
  let enterTimer = null, leaveTimer = null;
  g.addEventListener('mouseenter', () => {
    if (isTouch()) return;
    clearTimeout(leaveTimer);
    enterTimer = setTimeout(() => g.classList.add('open'), 60);
  });
  g.addEventListener('mouseleave', () => {
    if (isTouch()) return;
    clearTimeout(enterTimer);
    leaveTimer = setTimeout(() => g.classList.remove('open'), 200);
  });
});

document.querySelectorAll('.side-group > .side-item').forEach(b => b.addEventListener('click', () => {
  const group = b.parentElement;
  if (isTouch()) {
    // téléphone : un clic ouvre les options sans changer la liste
    const wasOpen = group.classList.contains('open');
    document.querySelectorAll('.side-group.open').forEach(g => g.classList.remove('open'));
    group.classList.toggle('open', !wasOpen);
    return;
  }
  selectChannels(b.dataset.view);
  b.blur();
}));
document.querySelectorAll('.sub-item').forEach(b => b.addEventListener('click', () => {
  selectChannels(b.dataset.view, b.dataset.status);
  b.blur();
  closeMenu();
}));
document.querySelectorAll('.side-item[data-page]').forEach(b => b.addEventListener('click', () => {
  showPage(b.dataset.page);
  b.blur();
  closeMenu();
}));
$('menu-toggle').addEventListener('click', () => {
  const open = !$('sidebar').classList.contains('show');
  $('sidebar').classList.toggle('show', open);
  $('backdrop').classList.toggle('show', open);
});
$('backdrop').addEventListener('click', closeMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* ---------- États ---------- */
function showSkeletons() {
  const grid = $('grid');
  grid.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('div');
    d.className = 'card skeleton';
    d.innerHTML = '<div class="sk sk-row"></div><div class="sk sk-strip"></div><div class="sk sk-line"></div><div class="sk sk-line" style="width:60%"></div><div class="sk sk-line" style="width:80%"></div>';
    grid.appendChild(d);
  }
  $('count').textContent = 'Chargement...';
  $('more-wrap').style.display = 'none';
}

function showMessage(title, text, withRetry) {
  $('grid').innerHTML = `<div class="message"><b>${esc(title)}</b>${esc(text)}${
    withRetry ? '<br><button class="icon-btn" id="retry-btn">Réessayer</button>' : ''}</div>`;
  if (withRetry) $('retry-btn').addEventListener('click', loadChannels);
  $('more-wrap').style.display = 'none';
}

/* ---------- Marchés ---------- */
async function loadMarkets() {
  try {
    const res = await fetch('/api/markets');
    if (!res.ok) throw new Error();
    const markets = await res.json();
    const select = $('market');
    const current = select.value;
    select.innerHTML = '<option value="all">Tous les marchés</option>';
    markets.forEach(m => {
      const o = document.createElement('option');
      o.value = m;
      o.textContent = capitalize(m);
      select.appendChild(o);
    });
    select.value = markets.includes(current) ? current : 'all';
  } catch (e) { /* le filtre garde "Tous les marchés" */ }
}

/* ---------- Chaînes ---------- */
function densityClass(score) { return score >= 0.3 ? 'good' : score >= 0.1 ? 'mid' : 'low'; }

function renderCard(c) {
  const score = c.density_score || 0;
  const proven = c.channel_status === 'PROVEN';
  const ids = (c.recent_video_ids || []).slice(0, 3);
  const strip = ids.length
    ? `<div class="strip">${ids.map(id => `<img loading="lazy" src="https://i.ytimg.com/vi/${esc(id)}/mqdefault.jpg" alt="">`).join('')}</div>`
    : '<div class="strip-empty"></div>';
  const avatarStyle = c.channel_thumbnail_url ? `background-image:url('${esc(c.channel_thumbnail_url)}')` : '';
  const initial = c.channel_thumbnail_url ? '' : esc((c.channel_title || '?').charAt(0).toUpperCase());

  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML = `
    <div class="card-head">
      <div class="avatar" style="${avatarStyle}">${initial}</div>
      <div class="head-text">
        <div class="card-title">${esc(c.channel_title || 'Sans nom')}</div>
        <div class="card-sub">${fmt(c.subscriber_count)} abonnés</div>
      </div>
      <div class="head-pills">
        <span class="pill ${proven ? 'proven' : 'watchlist'}">${proven ? 'PROVEN' : 'WATCHLIST'}</span>
        ${c.is_new ? '<span class="pill new">NEW</span>' : ''}
      </div>
    </div>
    ${strip}
    <div class="card-body">
      ${c.channel_description ? `<div class="desc">${esc(c.channel_description)}</div>` : ''}
      <div class="tags">
        <span class="tag">${esc(capitalize(c.market || '?'))}</span>
        <span class="tag ${densityClass(score)}">${Math.round(score * 100)}% densité</span>
        ${c.detected_language ? `<span class="tag">${esc(c.detected_language)}</span>` : ''}
        ${c.face_flag ? `<span class="tag face" title="Visage ? ${esc(c.face_hint || '')}" aria-label="Visage possible"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 15c1 1.2 2.1 1.8 3.5 1.8s2.5-.6 3.5-1.8"/><path d="M9 9.5h.01M15 9.5h.01"/></svg></span>` : ''}
      </div>
      <div class="stats">
        <div class="stat"><b>${c.proven_video_count || 0}</b><span>vidéos ≥100K</span></div>
        <div class="stat"><b>${c.strong_video_count || 0}</b><span>vidéos fortes</span></div>
        <div class="stat"><b>${c.total_videos_checked || 0}</b><span>vidéos</span></div>
      </div>
      <div class="card-foot">Découverte le ${c.first_discovered_at ? esc(c.first_discovered_at.slice(0, 10)) : '?'}</div>
      <div class="actions">
        <a class="btn-main" href="${esc(c.channel_url)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M14 3h7v7M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>YouTube
        </a>
        <button class="btn-danger labeled btn-del" title="Supprimer cette chaîne" aria-label="Supprimer cette chaîne">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Supprimer
        </button>
      </div>
    </div>`;
  el.querySelector('.btn-del').addEventListener('click', () => deleteChannel(c.channel_id, c.channel_title || ''));
  return el;
}

function renderGrid() {
  const grid = $('grid');
  grid.innerHTML = '';

  if (currentChannels.length === 0) {
    showMessage('Aucune chaîne', 'Aucune chaîne ne correspond à ces filtres.', false);
    $('count').textContent = '0 chaîne';
    return;
  }

  const shown = currentChannels.slice(0, visibleCount);
  shown.forEach(c => grid.appendChild(renderCard(c)));

  $('count').textContent = `${shown.length} affichée(s) sur ${currentChannels.length} chaîne(s)`;
  $('more-wrap').style.display = currentChannels.length > visibleCount ? '' : 'none';
}

async function loadChannels() {
  showSkeletons();
  visibleCount = PAGE_SIZE;

  const params = new URLSearchParams({
    search: $('search').value,
    market: $('market').value,
    view: currentView,
    status: currentStatus,
  });

  try {
    const res = await fetch('/api/channels?' + params.toString());
    if (!res.ok) throw new Error('http ' + res.status);
    const channels = await res.json();
    const sort = $('sort').value;
    channels.sort((a, b) => {
      const av = a[sort] || 0, bv = b[sort] || 0;
      if (typeof av === 'string' || typeof bv === 'string') return String(bv).localeCompare(String(av));
      return bv - av;
    });
    currentChannels = channels;
    renderGrid();
  } catch (e) {
    $('count').textContent = '';
    showMessage('Impossible de charger les chaînes',
      'Le serveur ou la base ne répond pas. Si le site vient de se réveiller, attends quelques secondes.', true);
  }
}

function askReason(title, needKey) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'modal-ov';
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <h3>Pourquoi supprimer "${esc(title)}" ?</h3>
      <p>Elle ne reviendra plus jamais dans la base.</p>
      ${needKey ? '<input type="password" id="admin-input" class="modal-input" placeholder="Mot de passe admin" autocomplete="off">' : ''}
      <button class="icon-btn" data-r="face">Elle a un visage (pas faceless)</button>
      <button class="icon-btn" data-r="topic">Sujet qui ne m'intéresse pas</button>
      <button class="icon-btn" data-r="">Annuler</button>
    </div>`;
    ov.addEventListener('click', e => {
      const btn = e.target.closest('button');
      const r = btn ? btn.dataset.r : (e.target === ov ? '' : null);
      if (r === null) return;
      let key = adminKey;
      if (r && needKey) {
        key = ov.querySelector('#admin-input').value;
        if (!key) { ov.querySelector('#admin-input').focus(); return; }
      }
      ov.remove();
      resolve(r ? { reason: r, key } : null);
    });
    document.body.appendChild(ov);
    const inp = ov.querySelector('#admin-input');
    if (inp) inp.focus();
  });
}

async function deleteChannel(channelId, title) {
  const choice = await askReason(title, !adminKey);
  if (!choice) return;
  adminKey = choice.key;

  try {
    const res = await fetch(`/api/channels/${channelId}?reason=${encodeURIComponent(choice.reason)}`, {
      method: 'DELETE',
      headers: { 'X-Admin-Key': adminKey },
    });
    if (res.ok) {
      loadChannels();
    } else {
      const data = await res.json().catch(() => ({}));
      alert('Erreur : ' + (data.error || 'suppression impossible'));
      if (res.status === 403) adminKey = null;
    }
  } catch (e) {
    alert('Erreur réseau : suppression impossible.');
  }
}

/* ---------- Statistiques ---------- */
function openMarket(market) {
  $('market').value = market;
  currentView = 'all';
  currentStatus = 'all';
  showPage('channels');
  loadChannels();
}

async function loadStats() {
  const box = $('stats-content');
  box.innerHTML = '<div class="message"><b>Chargement...</b></div>';

  try {
    const res = await fetch('/api/stats');
    if (!res.ok) throw new Error();
    const s = await res.json();
    const t = s.totals;

    const maxChannels = Math.max(1, ...s.markets.map(m => m.channels));

    const rows = s.markets.map(m => `
      <tr class="row-link" data-market="${esc(m.market)}">
        <td><b>${esc(capitalize(m.market))}</b></td>
        <td class="num">${fmt(m.channels)}</td>
        <td><div class="bar"><i style="width:${Math.round(m.channels / maxChannels * 100)}%"></i></div></td>
        <td class="num">${fmt(m.proven)}</td>
        <td class="num">${fmt(m.watchlist)}</td>
        <td class="num">${fmt(m.avg_subscribers)}</td>
        <td class="num">${Math.round(m.avg_density * 100)}%</td>
        <td class="num">${fmt(m.added_30d)}</td>
      </tr>`).join('');

    const tops = s.markets.map(m => `
      <div class="top-card">
        <h3>${esc(capitalize(m.market))}</h3>
        ${m.top_channels.map(c => `
          <a href="${esc(c.channel_url)}" target="_blank" rel="noopener">
            <span>${esc(c.channel_title || 'Sans nom')}</span>
            <span>${c.proven_video_count} ≥100K</span>
          </a>`).join('')}
      </div>`).join('');

    box.innerHTML = `
      <div class="kpis">
        <div class="kpi"><b>${fmt(t.channels)}</b><span>Chaînes</span></div>
        <div class="kpi"><b>${fmt(t.proven)}</b><span>Proven</span></div>
        <div class="kpi"><b>${fmt(t.watchlist)}</b><span>Watchlist</span></div>
        <div class="kpi"><b>${fmt(t.added_7d)}</b><span>Ajoutées sur 7 jours</span></div>
        <div class="kpi"><b>${fmt(t.added_30d)}</b><span>Ajoutées sur 30 jours</span></div>
      </div>

      <div class="panel">
        <h2>Par marché <span style="color:var(--muted);font-weight:400;font-size:12px">(clique sur une ligne pour voir ses chaînes)</span></h2>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Marché</th><th class="num">Chaînes</th><th></th><th class="num">Proven</th>
              <th class="num">Watchlist</th><th class="num">Abonnés moy.</th>
              <th class="num">Densité moy.</th><th class="num">+30 jours</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h2>Meilleures chaînes par marché <span style="color:var(--muted);font-weight:400;font-size:12px">(par nombre de vidéos ≥100K)</span></h2>
        <div class="top-grid">${tops}</div>
      </div>`;

    box.querySelectorAll('tr.row-link').forEach(tr =>
      tr.addEventListener('click', () => openMarket(tr.dataset.market)));
  } catch (e) {
    box.innerHTML = '<div class="message"><b>Impossible de charger les statistiques</b>Le serveur ou la base ne répond pas.<br><button class="icon-btn" id="stats-retry">Réessayer</button></div>';
    $('stats-retry').addEventListener('click', loadStats);
  }
}

/* ---------- Événements ---------- */
$('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadChannels, 250);
});
$('market').addEventListener('change', loadChannels);
$('sort').addEventListener('change', loadChannels);
$('more-btn').addEventListener('click', () => { visibleCount += PAGE_SIZE; renderGrid(); });

initTheme();
updateSidebar();
loadMarkets().then(loadChannels);
</script>
<script src="/static/competition.js?v=1"></script>

</body>
</html>
